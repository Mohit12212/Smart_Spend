<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SmartSpend - Modern Personal Finance Dashboard, AI Budget Analytics & Expense Tracker">
  <meta name="theme-color" content="#6366f1">
  <title>SmartSpend — Personal Finance & Expense Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo" aria-hidden="true">💰</span>
    <h1>Smart<span class="gr">Spend</span></h1>
  </div>

  <div class="row hd">
    <div class="month-stepper">
      <button class="b g icon-btn" id="m-prev" type="button" title="Previous month" aria-label="Previous month">◀</button>
      <input type="month" id="month" aria-label="Month">
      <button class="b g icon-btn" id="m-next" type="button" title="Next month" aria-label="Next month">▶</button>
    </div>

    <button class="b add-btn" id="add" type="button">＋ Add Transaction</button>
    
    <div class="header-actions">
      <select id="curr-sel" class="chip curr-picker" title="Change display currency" aria-label="Currency">
        <option value="INR" selected>₹ INR</option>
        <option value="USD">$ USD</option>
        <option value="EUR">€ EUR</option>
        <option value="GBP">£ GBP</option>
        <option value="JPY">¥ JPY</option>
        <option value="CAD">$ CAD</option>
        <option value="AUD">$ AUD</option>
        <option value="AED">AED</option>
      </select>
      <button class="b g" id="demo" type="button" title="Fill with 8 months of realistic sample data">✨ Demo data</button>
      <button class="b g danger-hover" id="reset" type="button" title="Wipe all account data">🗑 Reset</button>
      <button class="b g pal-btn" id="pal" type="button" title="Command palette (Ctrl+K or Cmd+K)"><span class="kbd">⌘K</span></button>
      <button class="b g theme-btn" id="theme" type="button" aria-label="Toggle theme" title="Toggle dark/light theme">🌓</button>
      <button class="b g" id="shortcuts-btn" type="button" title="Keyboard shortcuts (?)">⌨️</button>
    </div>

    <div class="user-pill-wrap">
      <span class="chip user-chip" id="who">👤</span>
      <button class="b g logout-btn" id="logout" type="button" title="Sign out of your account">Log out</button>
    </div>
  </div>
</header>

<nav id="nav" aria-label="Navigation Tabs"></nav>

<main>
  <div class="card qa">
    <div class="qa-input-wrap">
      <span class="qa-icon" aria-hidden="true">⚡</span>
      <input id="qa" placeholder="Quick add: “spent 250 on pizza yesterday”, “uber 180 3 days ago”, “got salary 55k”" autocomplete="off" maxlength="200" aria-label="Natural language expense quick add">
      <span class="qa-enter-hint">Press ↵</span>
    </div>
    <div id="qp" class="mu qp"></div>
    <div class="qa-chips">
      <span class="mu-label">Quick suggestions:</span>
      <button type="button" class="qa-chip" data-t="coffee 120 today">☕ Coffee 120</button>
      <button type="button" class="qa-chip" data-t="swiggy 380 yesterday">🍕 Pizza 380</button>
      <button type="button" class="qa-chip" data-t="uber 210 2 days ago">🚗 Uber 210</button>
      <button type="button" class="qa-chip" data-t="groceries 1450">🛒 Groceries 1,450</button>
      <button type="button" class="qa-chip" data-t="wifi bill 799">💡 Wi-Fi 799</button>
      <button type="button" class="qa-chip" data-t="freelance project 12k">💻 Freelance 12k</button>
    </div>
  </div>

  <div id="view"></div>
</main>

<!-- Transaction Add/Edit Modal -->
<div class="modal" id="modal" hidden>
  <div class="card mbox">
    <div class="modal-header">
      <h2 id="mt">Add transaction</h2>
      <button type="button" class="x close-modal" id="m-x" aria-label="Close">✕</button>
    </div>
    <div class="stack">
      <div class="row">
        <label>Type
          <select id="m-type">
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </label>
        <label>Amount
          <input id="m-amt" type="number" min="0.01" step="0.01" placeholder="0.00" required>
        </label>
      </div>
      <div class="row">
        <label>Category
          <select id="m-cat"></select>
        </label>
        <label>Date
          <input id="m-date" type="date" required>
        </label>
      </div>
      <label>Note / Description
        <input id="m-note" maxlength="200" placeholder="e.g. Swiggy dinner, Uber ride, Grocery store">
      </label>
      <div class="row modal-actions">
        <button class="b" id="m-save" type="button">Save Transaction</button>
        <button class="b g" id="m-cancel" type="button">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Command Palette Modal -->
<div class="modal" id="palette" hidden>
  <div class="card mbox pal-box">
    <div class="pal-search-wrap">
      <span class="pal-icon">🔍</span>
      <input id="p-in" placeholder="Type a command or jump to page…" autocomplete="off">
      <span class="kbd">ESC</span>
    </div>
    <div id="p-list"></div>
  </div>
</div>

<!-- Keyboard Shortcuts Modal -->
<div class="modal" id="shortcuts-modal" hidden>
  <div class="card mbox">
    <div class="modal-header">
      <h2>⌨️ Keyboard Shortcuts</h2>
      <button type="button" class="x" id="sc-x">✕</button>
    </div>
    <div class="shortcuts-grid">
      <div class="sc-row"><span class="kbd">⌘K</span> / <span class="kbd">Ctrl+K</span><span>Open Command Palette</span></div>
      <div class="sc-row"><span class="kbd">A</span> / <span class="kbd">N</span><span>New Transaction</span></div>
      <div class="sc-row"><span class="kbd">/</span><span>Focus Quick-Add Bar</span></div>
      <div class="sc-row"><span class="kbd">1</span> – <span class="kbd">7</span><span>Switch Tabs</span></div>
      <div class="sc-row"><span class="kbd">[</span> / <span class="kbd">]</span><span>Previous / Next Month</span></div>
      <div class="sc-row"><span class="kbd">T</span><span>Toggle Theme (Dark / Light)</span></div>
      <div class="sc-row"><span class="kbd">?</span><span>Show this Shortcuts Guide</span></div>
      <div class="sc-row"><span class="kbd">ESC</span><span>Close Active Modal</span></div>
    </div>
    <div style="margin-top:16px;text-align:right">
      <button class="b g" id="sc-close" type="button">Got it</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="lib/chart.umd.js"></script>
<script src="js/analytics.js"></script>
<script src="js/auth.js"></script>
<script src="js/localapi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
